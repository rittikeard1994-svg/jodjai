<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'none'; worker-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>จดจ่าย</title>
<meta name="description" content="บันทึกรายจ่ายรายวัน ดูงบบนปฏิทิน ข้อมูลเก็บในเครื่องเท่านั้น">
<meta name="theme-color" content="#f3f5fb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="จดจ่าย">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
:root{
  --bg:#f3f5fb;--card:#ffffff;--ink:#1c2333;--muted:#677086;--faint:#9aa2b3;--line:#e4e8f1;--soft:#f1f3f9;
  --accent:#4c6ef5;--accent2:#8b5cf6;--accent-soft:#e9eeff;
  --good:#18925b;--good-bg:#e1f5e9;--good-line:#b9e5cb;
  --warn:#a86b00;--warn-bg:#fff1c7;--warn-line:#f1d27c;
  --bad:#d9363e;--bad-bg:#ffe2e3;--bad-line:#f2a2a6;
  --pay:#18a05e;--due:#3b82f6;--hl:#8b5cf6;--lux:#f59e0b;
  --shadow:0 1px 2px rgba(20,30,60,.04),0 8px 24px rgba(20,30,60,.06);
  --r:18px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11141c;--card:#1a1f2b;--ink:#e8ebf3;--muted:#9aa3b8;--faint:#6d7590;--line:#2a3142;--soft:#222837;
    --accent:#7b93ff;--accent2:#a78bfa;--accent-soft:#252d4a;
    --good:#4fd18f;--good-bg:#173527;--good-line:#24573d;
    --warn:#f2c14e;--warn-bg:#3a2f12;--warn-line:#6b5418;
    --bad:#ff7a80;--bad-bg:#3d1a1d;--bad-line:#7a2c32;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  --bg:#11141c;--card:#1a1f2b;--ink:#e8ebf3;--muted:#9aa3b8;--faint:#6d7590;--line:#2a3142;--soft:#222837;
  --accent:#7b93ff;--accent2:#a78bfa;--accent-soft:#252d4a;
  --good:#4fd18f;--good-bg:#173527;--good-line:#24573d;
  --warn:#f2c14e;--warn-bg:#3a2f12;--warn-line:#6b5418;
  --bad:#ff7a80;--bad-bg:#3d1a1d;--bad-line:#7a2c32;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,'Sukhumvit Set','Thonburi','Leelawadee UI','Noto Sans Thai',system-ui,sans-serif;font-size:15px;line-height:1.45;padding-bottom:calc(86px + env(safe-area-inset-bottom));-webkit-text-size-adjust:100%}
body.noscroll{overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink)}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;background:color-mix(in srgb,var(--bg) 86%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.top .logo{width:34px;height:34px;flex:none}
.top h1{font-size:18px;margin:0;font-weight:700;letter-spacing:.2px}
.top .sub{font-size:11.5px;color:var(--muted);margin-top:-2px}
.top .menu{margin-left:auto;width:42px;height:42px;border-radius:12px;border:0;background:transparent;display:grid;place-items:center}
.top .menu svg{width:24px;height:24px}
main{max-width:560px;margin:0 auto;padding:2px 16px 24px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;margin-bottom:14px}
.card h2{font-size:15.5px;margin:0 0 12px;font-weight:600}
.card h2 small{font-weight:400;color:var(--muted);font-size:12.5px}
.muted{color:var(--muted)} .small{font-size:12.5px} .faint{color:var(--faint)}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.grow{flex:1;min-width:0}
.mnav{display:flex;align-items:center;justify-content:center;gap:6px;margin:4px 0 12px}
.mnav b{min-width:150px;text-align:center;font-size:16.5px}
.mnav button{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:20px;line-height:1}
.mnav .mtoday{width:auto;padding:0 12px;font-size:13px;color:var(--accent);border-color:var(--accent-soft);background:var(--accent-soft)}
/* calendar */
.cal-head,.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal-head{margin-bottom:6px}
.cal-head div{text-align:center;font-size:12.5px;color:var(--muted)}
.cell{aspect-ratio:1/1.14;border-radius:13px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:1.5px solid transparent;background:var(--soft);padding:2px 0;min-width:0}
.cell .d{font-weight:700;font-size:15px;line-height:1.05}
.cell .a{font-size:10.5px;font-weight:600;line-height:1.1;height:12px;white-space:nowrap}
.cell .dots{display:flex;gap:2px;height:5px}
.cell .dots i{width:5px;height:5px;border-radius:50%;display:block}
.cell.none .d{color:var(--muted)}
.cell.low{background:var(--good-bg)} .cell.low .d,.cell.low .a{color:var(--good)}
.cell.high{background:var(--warn-bg)} .cell.high .d,.cell.high .a{color:var(--warn)}
.cell.over{background:var(--bad-bg);border-color:var(--bad-line)} .cell.over .d,.cell.over .a{color:var(--bad)}
.cell.future{background:transparent;border:1.5px dashed var(--line)} .cell.future .d{color:var(--faint)}
.cell.empty{visibility:hidden}
.cell.today{border:2px solid var(--ink)}
.cell.sel{box-shadow:0 0 0 2.5px var(--accent);}
.k-pay{background:var(--pay)} .k-due{background:var(--due)} .k-over{background:var(--bad)} .k-hl{background:var(--hl)} .k-lux{background:var(--lux)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:8px;height:8px;border-radius:50%;display:inline-block}
.legend .sw{width:16px;height:10px;border-radius:4px;display:inline-block}
/* time of day */
.tod{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.tod div{border-radius:14px;background:var(--soft);padding:10px 4px;text-align:center;border:1.5px solid transparent}
.tod div.max{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 45%,transparent)}
.tod .e{font-size:20px} .tod b{display:block;font-size:13px} .tod .p{font-size:19px;font-weight:700;margin:2px 0}
.tod small{display:block;font-size:11px;color:var(--muted);line-height:1.35}
/* day detail */
.big{font-size:30px;font-weight:700;line-height:1.15;letter-spacing:-.3px}
.big small{font-size:15px;color:var(--muted);font-weight:500;letter-spacing:0}
.big.over{color:var(--bad)} .big.high{color:var(--warn)} .big.low{color:var(--good)}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:4px 10px;font-size:12.5px;font-weight:600;white-space:nowrap}
.pill.over{background:var(--bad-bg);color:var(--bad)} .pill.high{background:var(--warn-bg);color:var(--warn)} .pill.low{background:var(--good-bg);color:var(--good)} .pill.info{background:var(--accent-soft);color:var(--accent)} .pill.mute{background:var(--soft);color:var(--muted)}
.bar{height:9px;border-radius:9px;background:var(--soft);overflow:hidden;margin:10px 0 6px}
.bar i{display:block;height:100%;border-radius:9px;background:var(--good)}
.bar.high i{background:var(--lux)} .bar.over i{background:var(--bad)}
.evt{display:flex;flex-direction:column;gap:6px;margin:10px 0 2px}
.evt div{font-size:13px;background:var(--soft);border-radius:10px;padding:7px 10px}
/* list */
.list{display:flex;flex-direction:column;margin:8px 0}
.item{display:flex;align-items:center;gap:11px;padding:10px 2px;border:0;background:none;text-align:left;width:100%;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:20px;flex:none}
.item .tx{flex:1;min-width:0}
.item .tx b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .tx small{display:block;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .am{font-weight:700;white-space:nowrap}
.tg{font-style:normal;font-size:10.5px;border-radius:6px;padding:1px 6px;margin-left:3px;font-weight:600}
.tg.hl{background:color-mix(in srgb,var(--hl) 16%,transparent);color:var(--hl)}
.tg.lux{background:color-mix(in srgb,var(--lux) 18%,transparent);color:var(--warn)}
.tg.fx{background:color-mix(in srgb,var(--due) 15%,transparent);color:var(--due)}
.dayhead{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);font-weight:600;padding:12px 2px 2px}
.empty-note{text-align:center;color:var(--muted);padding:18px 8px;font-size:14px}
/* buttons */
.btn{border:0;border-radius:14px;padding:12px 16px;font-weight:600;background:var(--soft);display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}
.btn.soft{background:var(--accent-soft);color:var(--accent)}
.btn.danger{background:var(--bad-bg);color:var(--bad)}
.btn.block{width:100%}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:11px}
.btn:disabled{opacity:.5}
.fab{position:fixed;right:max(16px,calc(50% - 264px));bottom:calc(82px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:50%;border:0;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-size:32px;line-height:1;box-shadow:0 10px 24px rgba(86,80,240,.38);z-index:25;display:grid;place-items:center}
.fab.hide{display:none}
/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
.nav .in{max-width:560px;margin:0 auto;display:flex}
.nav button{flex:1;border:0;background:none;color:var(--muted);font-size:11.5px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:5px 0}
.nav button svg{width:24px;height:24px}
.nav button.on{color:var(--accent);font-weight:600}
/* today */
.hero{display:flex;align-items:center;gap:16px}
.ring{width:108px;height:108px;flex:none;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-weight:700;font-size:20px;line-height:1.1}
.ring .c small{display:block;font-size:11px;color:var(--muted);font-weight:500}
.tip{margin-top:12px;background:var(--soft);border-radius:12px;padding:10px 12px;font-size:13.5px}
.tip b{color:var(--accent)}
.qgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.qgrid button{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:10px 2px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;min-width:0}
.qgrid button span{font-size:22px}
.qgrid button em{font-style:normal;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;padding:0 3px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 12px;font-size:13.5px;display:inline-flex;align-items:center;gap:5px}
.chip b{font-weight:600;color:var(--accent)}
.chip.on{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 40%,transparent);color:var(--accent);font-weight:600}
.banner{display:flex;gap:10px;align-items:center;background:var(--warn-bg);border:1px solid var(--warn-line);border-radius:14px;padding:10px 12px;margin-bottom:14px;font-size:13.5px}
.banner.info{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 30%,transparent)}
/* summary */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--soft);border-radius:14px;padding:11px 12px}
.kpi small{display:block;color:var(--muted);font-size:12px}
.kpi b{display:block;font-size:20px;font-weight:700;margin-top:1px}
.kpi em{font-style:normal;font-size:12px;color:var(--muted)}
.kpi b.bad{color:var(--bad)} .kpi b.good{color:var(--good)}
.chart{width:100%;height:auto;display:block}
.donut-wrap{display:flex;gap:14px;align-items:center}
.donut{width:120px;height:120px;flex:none}
.catrow{display:flex;align-items:center;gap:8px;font-size:13.5px;padding:5px 0}
.catrow .sw{width:10px;height:10px;border-radius:3px;flex:none}
.catrow .n{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.catrow .v{font-weight:600}
.catrow .pc{color:var(--muted);width:40px;text-align:right;font-size:12px}
/* recurring */
.rec{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid var(--line)}
.rec:last-child{border-bottom:0}
.rec .tx{flex:1;min-width:0;border:0;background:none;text-align:left;padding:0}
.rec .tx b{display:block;font-weight:600}
.rec .tx small{display:block;color:var(--muted);font-size:12px}
.rec .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:20px;flex:none}
.rec .st{display:flex;flex-direction:column;align-items:flex-end;gap:5px}
/* sheet */
.backdrop{position:fixed;inset:0;background:rgba(12,16,30,.42);z-index:50;opacity:0;transition:opacity .22s}
.backdrop.open{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;background:var(--card);border-radius:22px 22px 0 0;max-height:92vh;max-height:92dvh;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:6px 16px calc(20px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .26s cubic-bezier(.2,.8,.2,1);max-width:560px;margin:0 auto;overscroll-behavior:contain}
.sheet.open{transform:none}
.grab{width:42px;height:5px;border-radius:5px;background:var(--line);margin:4px auto 8px}
.sh-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.sh-h b{font-size:17px}
.x{width:36px;height:36px;border-radius:50%;border:0;background:var(--soft);font-size:16px}
.amt{display:flex;align-items:center;gap:6px;border-bottom:2px solid var(--accent);padding:4px 2px 6px;margin-bottom:4px}
.amt span{font-size:26px;color:var(--muted);font-weight:600}
.amt input{border:0;outline:0;background:transparent;font-size:34px;font-weight:700;width:100%;padding:0}
.hint{font-size:12px;color:var(--faint);margin-bottom:12px}
.catpick{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;margin-bottom:12px}
.catpick button{border:1.5px solid var(--line);background:var(--card);border-radius:13px;padding:8px 2px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;min-width:0}
.catpick button span{font-size:21px}
.catpick button em{font-style:normal;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;padding:0 2px}
.catpick button.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:600}
.fld{display:block;margin-bottom:12px}
.fld>span{display:block;font-size:12.5px;color:var(--muted);margin-bottom:5px}
.fld input,.fld select{width:100%;border:1px solid var(--line);background:var(--soft);border-radius:12px;padding:11px 12px;outline:0;-webkit-appearance:none;appearance:none;min-height:46px}
.fld input:focus,.fld select:focus{border-color:var(--accent)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.toggles{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:14px}
.seg{display:flex;background:var(--soft);border-radius:12px;padding:3px;margin-bottom:10px}
.seg button{flex:1;border:0;background:none;border-radius:10px;padding:9px 6px;font-size:13.5px;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.sec{border-top:1px solid var(--line);padding-top:14px;margin-top:6px}
.sec h3{font-size:14.5px;margin:0 0 10px}
.catman{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
.catman div{display:flex;align-items:center;gap:8px;background:var(--soft);border-radius:11px;padding:6px 8px 6px 10px}
.catman div span{flex:1}
.catman div button{border:0;background:none;color:var(--faint);font-size:15px;width:30px;height:30px}
.addcat{display:grid;grid-template-columns:64px 1fr auto;gap:8px;align-items:center}
.addcat input{border:1px solid var(--line);background:var(--soft);border-radius:12px;padding:10px;outline:0;width:100%;min-height:44px}
.btnrow{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.steps{margin:0;padding-left:20px;font-size:13.5px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(10px);background:#1d2233;color:#fff;border-radius:14px;padding:10px 14px;font-size:14px;z-index:60;opacity:0;transition:.22s;display:flex;gap:12px;align-items:center;max-width:calc(100vw - 32px);box-shadow:0 8px 24px rgba(0,0,0,.25)}
.toast.show{opacity:1;transform:translateX(-50%)}
.toast button{border:0;background:none;color:#a9b8ff;font-weight:700;padding:0}
.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
/* import */
.imp-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.imp-btns button{border:1.5px dashed color-mix(in srgb,var(--accent) 45%,transparent);background:var(--accent-soft);color:var(--accent);border-radius:16px;padding:14px 8px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:14px}
.imp-btns button span{font-size:26px}
.imp-btns button small{font-weight:400;color:var(--muted);font-size:11.5px}
.menu-list{display:flex;flex-direction:column;gap:8px}
.menu-list button{display:flex;align-items:center;gap:12px;border:1px solid var(--line);background:var(--card);border-radius:16px;padding:14px;text-align:left}
.menu-list button span{font-size:26px;width:40px;text-align:center}
.menu-list button b{display:block}
.menu-list button small{color:var(--muted);font-size:12.5px}
.prog{height:8px;border-radius:8px;background:var(--soft);overflow:hidden;margin:14px 0 8px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .3s}
.irow{border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:8px;background:var(--card)}
.irow.off{opacity:.55;background:var(--soft)}
.irow.unk{border-color:var(--warn-line);background:color-mix(in srgb,var(--warn-bg) 55%,var(--card))}
.irow .top1{display:flex;align-items:center;gap:10px}
.irow .top1 input[type=checkbox]{width:22px;height:22px;accent-color:var(--accent);flex:none}
.irow .who{flex:1;min-width:0}
.irow .who b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.irow .who small{color:var(--muted);font-size:12px}
.irow .amtin{width:96px;text-align:right;font-weight:700;border:1px solid var(--line);background:var(--soft);border-radius:10px;padding:6px 8px}
.irow .ctl{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap}
.irow .ctl select{flex:1;min-width:150px;border:1px solid var(--line);background:var(--soft);border-radius:10px;padding:8px 10px;min-height:40px;-webkit-appearance:none;appearance:none}
.irow .ctl label{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:5px}
.why{font-size:11.5px;border-radius:7px;padding:2px 7px;font-weight:600;white-space:nowrap}
.why.rule{background:var(--good-bg);color:var(--good)} .why.dict{background:var(--accent-soft);color:var(--accent)} .why.unk{background:var(--warn-bg);color:var(--warn)} .why.skip{background:var(--soft);color:var(--muted)} .why.chk{background:var(--bad-bg);color:var(--bad)}
.irow .thumb{width:44px;height:58px;object-fit:cover;object-position:top;border-radius:8px;border:1px solid var(--line);flex:none}
.sticky-save{position:sticky;bottom:calc(-20px - env(safe-area-inset-bottom));background:var(--card);padding:10px 0 calc(8px + env(safe-area-inset-bottom));margin-top:6px;border-top:1px solid var(--line)}
.src{font-style:normal;font-size:10px;font-weight:700;border-radius:5px;padding:0 5px;margin-left:3px;color:#fff}
.src.KBANK{background:#138f2d} .src.SCB{background:#4e2a84} .src.OTHER{background:#64748b}
.rulelist{display:flex;flex-direction:column;gap:6px;max-height:240px;overflow:auto;margin-bottom:8px}
.rulelist div{display:flex;align-items:center;gap:8px;background:var(--soft);border-radius:10px;padding:6px 8px 6px 10px;font-size:13px}
.rulelist div span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rulelist div button{border:0;background:none;color:var(--faint);width:28px;height:28px}
@media (max-width:360px){.cell .a{font-size:9.5px}.cal-head,.cal-grid{gap:4px}.tod small{font-size:10px}}
</style>
</head>
<body>

  <svg class="logo" viewBox="0 0 64 64" aria-hidden="true"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5b7cfa"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient></defs><rect width="64" height="64" rx="16" fill="url(#lg)"/><rect x="15" y="12" width="28" height="38" rx="5" fill="#fff"/><path d="M21 21h16M21 28h16M21 35h9" stroke="#c3ccff" stroke-width="3" stroke-linecap="round"/><circle cx="44" cy="44" r="11.5" fill="#ffd166" stroke="#fff" stroke-width="3"/><text x="44" y="49" font-size="13" font-weight="700" text-anchor="middle" fill="#7a4b00" font-family="Tahoma,sans-serif">฿</text></svg>
  <div><h1>จดจ่าย</h1><div class="sub" id="topsub">บันทึกรายจ่าย · ข้อมูลอยู่ในเครื่องนี้</div></div>
  <button class="menu" data-act="settings" aria-label="ตั้งค่า"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>

<main id="view"></main>

<nav class="nav"><div class="in">

  <button data-tab="calendar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/><circle cx="12" cy="15" r="1.4" fill="currentColor" stroke="none"/></svg>ปฏิทิน</button>
  <button data-tab="today"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="5" y="3" width="14" height="18" rx="2.5"/><path d="M12 7v10M14.5 9.2c-.4-.8-1.4-1.3-2.5-1.3-1.4 0-2.5.8-2.5 1.9 0 2.6 5 1.4 5 4.1 0 1.1-1.1 1.9-2.5 1.9-1.2 0-2.2-.5-2.6-1.4"/></svg>วันนี้</button>
  <button data-tab="log"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 5h16v14H4z" stroke-linejoin="round"/><path d="M8 9h8M8 13h8M8 17h5"/></svg>บันทึก</button>

<input type="file" id="importFile" accept="application/json,.json" hidden>

<input type="file" id="pdfFile" accept="application/pdf,.pdf" multiple hidden>
<script>
'use strict';
/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const TH_M = ['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
const TH_MS = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
const TH_D = ['อา','จ','อ','พ','พฤ','ศ','ส'];
const TH_DF = ['อาทิตย์','จันทร์','อังคาร','พุธ','พฤหัสบดี','ศุกร์','เสาร์'];
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseYmd = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const dim = (y, m) => new Date(y, m + 1, 0).getDate();
const todayStr = () => ymd(new Date());
const nowHM = () => { const d = new Date(); return pad(d.getHours()) + ':' + pad(d.getMinutes()); };
const be = y => y + 543;
const fmt = n => Number(n || 0).toLocaleString('en-US', { maximumFractionDigits: 2 });
const fmt0 = n => Math.round(Number(n || 0)).toLocaleString('en-US');
const fmtC = n => n >= 10000 ? (n / 1000).toFixed(n >= 100000 ? 0 : 1) + 'K' : fmt0(n);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const sum = (a, f = e => e.amt) => a.reduce((t, e) => t + (+f(e) || 0), 0);
const counted = a => a.filter(e => !e.fixed);
const mkey = (y, m) => `${y}-${pad(m + 1)}`;
const shortDate = ds => { const d = parseYmd(ds); return `${TH_D[d.getDay()]}. ${d.getDate()} ${TH_MS[d.getMonth()]} ${String(be(d.getFullYear())).slice(2)}`; };
const longDate = ds => { const d = parseYmd(ds); return `วัน${TH_DF[d.getDay()]}ที่ ${d.getDate()} ${TH_M[d.getMonth()]} ${be(d.getFullYear())}`; };

/* ---------- state ---------- */
const KEY = 'jodjai.v1';
const DEF_CATS = [
  { id: 'food', name: 'อาหาร', icon: '🍜', color: '#f97316' },
  { id: 'drink', name: 'เครื่องดื่ม/ขนม', icon: '🧋', color: '#b7791f' },
  { id: 'travel', name: 'เดินทาง', icon: '🚕', color: '#0ea5e9' },
  { id: 'fuel', name: 'น้ำมันรถ', icon: '⛽', color: '#0369a1' },
  { id: 'shop', name: 'ช้อปปิ้ง', icon: '🛍️', color: '#ec4899' },
  { id: 'home', name: 'ของใช้ในบ้าน', icon: '🧴', color: '#14b8a6' },
  { id: 'health', name: 'สุขภาพ', icon: '💊', color: '#8b5cf6' },
  { id: 'fun', name: 'บันเทิง', icon: '🎬', color: '#e11d48' },
  { id: 'bill', name: 'บิล/ค่าบริการ', icon: '🧾', color: '#64748b' },
  { id: 'family', name: 'ครอบครัว', icon: '🏠', color: '#16a34a' },
  { id: 'work', name: 'งาน/เรียน', icon: '📚', color: '#4f46e5' },
  { id: 'transfer', name: 'โอนให้บุคคล', icon: '👤', color: '#0891b2' },
  { id: 'loan', name: 'ผ่อน/บัตรเครดิต', icon: '💳', color: '#be123c' },
  { id: 'wallet', name: 'วอลเล็ต (TrueMoney/LINE Pay)', icon: '📱', color: '#7c3aed' },
  { id: 'other', name: 'อื่น ๆ', icon: '📦', color: '#94a3b8' }
];
const PALETTE = ['#f97316','#0ea5e9','#ec4899','#14b8a6','#8b5cf6','#e11d48','#16a34a','#4f46e5','#b7791f','#0369a1','#64748b'];
const defState = () => ({ v: 1, settings: { mode: 'monthly', monthly: 0, daily: 0, warn: 80, payday: 0, lastBackup: null }, cats: DEF_CATS.map(c => ({ ...c })), ex: [], rec: [], rules: {} });
function load() {
  let s = defState(), raw = null;
  try { raw = localStorage.getItem(KEY); } catch (e) {}
  if (raw) {
    try {
      const o = JSON.parse(raw);
      s = { ...s, ...o, settings: { ...s.settings, ...(o.settings || {}) } };
      if (!Array.isArray(s.ex)) s.ex = [];
      if (!Array.isArray(s.rec)) s.rec = [];
      if (!Array.isArray(s.cats) || !s.cats.length) s.cats = DEF_CATS.map(c => ({ ...c }));
      if (!s.rules || typeof s.rules !== 'object') s.rules = {};
      for (const id of ['transfer', 'loan', 'wallet']) if (!s.cats.some(c => c.id === id)) { const oi = s.cats.findIndex(c => c.id === 'other'); s.cats.splice(oi < 0 ? s.cats.length : oi, 0, { ...DEF_CATS.find(c => c.id === id) }); }
      if (!s.cats.some(c => c.id === 'other')) s.cats.push({ ...DEF_CATS[DEF_CATS.length - 1] });
    } catch (e) {}
  }
  return s;
}
let S = load();
let IX = null, saveWarned = false;
function save() {
  IX = null;
  try { localStorage.setItem(KEY, JSON.stringify({ v: 1, settings: S.settings, cats: S.cats, ex: S.ex, rec: S.rec, rules: S.rules })); }
  catch (e) { if (!saveWarned) { saveWarned = true; toast('⚠️ บันทึกลงเครื่องไม่ได้ ลองปิดโหมดส่วนตัวของ Safari'); } }
}
const now0 = new Date();
const U = { tab: 'today', month: { y: now0.getFullYear(), m: now0.getMonth() }, sel: todayStr(), q: '', qcat: '', allMonths: false };
try { const t = localStorage.getItem('jodjai.tab'); if (t) U.tab = t; } catch (e) {}

/* ---------- derived ---------- */
function ix() {
  if (IX) return IX;
  const byDate = new Map();
  for (const e of S.ex) { if (!byDate.has(e.date)) byDate.set(e.date, []); byDate.get(e.date).push(e); }
  for (const a of byDate.values()) a.sort((x, y) => (x.time || '').localeCompare(y.time || ''));
  return (IX = { byDate });
}
const dayList = ds => ix().byDate.get(ds) || [];
const daySpent = ds => sum(counted(dayList(ds)));
const monthList = (y, m) => { const p = mkey(y, m) + '-'; return S.ex.filter(e => e.date.startsWith(p)); };
const catOf = id => S.cats.find(c => c.id === id) || S.cats.find(c => c.id === 'other') || DEF_CATS[DEF_CATS.length - 1];
function dayBudget(ds) {
  const s = S.settings;
  if (s.mode === 'daily') return +s.daily || 0;
  const d = parseYmd(ds);
  return (+s.monthly || 0) / dim(d.getFullYear(), d.getMonth());
}
function monthBudget(y, m) { const s = S.settings; return s.mode === 'daily' ? (+s.daily || 0) * dim(y, m) : (+s.monthly || 0); }
const hasBudget = () => (S.settings.mode === 'daily' ? +S.settings.daily : +S.settings.monthly) > 0;
function level(sp, bud) {
  if (sp <= 0) return 'none';
  if (bud <= 0) return 'low';
  const p = sp / bud * 100;
  return p > 100 ? 'over' : p >= (+S.settings.warn || 80) ? 'high' : 'low';
}
function paydayOf(y, m) { const p = +S.settings.payday || 0; if (!p) return 0; return p === 99 ? dim(y, m) : Math.min(p, dim(y, m)); }
const dueDay = (r, y, m) => Math.min(+r.day || 1, dim(y, m));
function dueMap(y, m) { const o = {}; for (const r of S.rec) { if (r.active === false) continue; const d = dueDay(r, y, m); (o[d] = o[d] || []).push(r); } return o; }
const paidExp = (r, key) => S.ex.find(e => e.rid === r.id && e.rm === key);
const bucket = t => { const h = parseInt((t || '12').slice(0, 2), 10); return h >= 5 && h < 12 ? 0 : h >= 12 && h < 17 ? 1 : h >= 17 && h < 21 ? 2 : 3; };

/* ---------- small UI pieces ---------- */
function monthNav() {
  const { y, m } = U.month, cur = mkey(y, m) === todayStr().slice(0, 7);
  return `<div class="mnav"><button data-act="mprev" aria-label="เดือนก่อน">‹</button><b>${TH_M[m]} ${be(y)}</b><button data-act="mnext" aria-label="เดือนถัดไป">›</button>${cur ? '' : '<button class="mtoday" data-act="mnow">เดือนนี้</button>'}</div>`;
}
function row(e, showDate) {
  const c = catOf(e.cat);
  const tags = (e.tags && e.tags.h ? '<em class="tg hl">สุขภาพ</em>' : '') + (e.tags && e.tags.l ? '<em class="tg lux">ฟุ่มเฟือย</em>' : '') + (e.fixed ? '<em class="tg fx">ประจำ</em>' : '') + (e.src ? `<em class="src ${e.src.bank === 'KBANK' || e.src.bank === 'SCB' ? e.src.bank : 'OTHER'}">${e.src.bank === 'KBANK' ? 'K' : e.src.bank === 'SCB' ? 'SCB' : '฿'}</em>` : '');
  return `<button class="item" data-act="edit" data-id="${e.id}"><span class="ic" style="background:${c.color}22">${c.icon}</span><span class="tx"><b>${esc(e.note || c.name)}</b><small>${showDate ? shortDate(e.date) + ' · ' : ''}${e.time ? e.time + ' น. · ' : ''}${esc(c.name)}${tags}</small></span><span class="am">฿${fmt(e.amt)}</span></button>`;
}
function pillFor(lv, sp, bud) {
  if (lv === 'over') return `<span class="pill over">⚠ เกินงบ ฿${fmt0(sp - bud)}</span>`;
  if (lv === 'high') return `<span class="pill high">ใกล้เต็มงบ</span>`;
  if (lv === 'low') return `<span class="pill low">✓ อยู่ในงบ</span>`;
  return '';
}
function barFor(sp, bud) {
  const lv = level(sp, bud), p = bud > 0 ? Math.min(100, sp / bud * 100) : 0;
  return `<div class="bar ${lv}"><i style="width:${p.toFixed(1)}%"></i></div>`;
}
function timePanel(list, title) {
  const B = [{ n: 'เช้า', e: '🌤️' }, { n: 'บ่าย', e: '☀️' }, { n: 'เย็น', e: '🌇' }, { n: 'กลางคืน', e: '🌙' }].map(b => ({ ...b, c: 0, a: 0 }));
  for (const e of list) { const b = B[bucket(e.time)]; b.c++; b.a += +e.amt || 0; }
  const tot = sum(B, b => b.a);
  const mx = Math.max(...B.map(b => b.a));
  return `<div class="card"><h2>ช่วงเวลาที่ใช้จ่ายมากที่สุด <small>— ${title}</small></h2>${tot ? `<div class="tod">${B.map(b => `<div class="${b.a === mx && mx > 0 ? 'max' : ''}"><div class="e">${b.e}</div><b>${b.n}</b><div class="p">${Math.round(b.a / tot * 100)}%</div><small>${b.c} รายการ</small><small>${fmt0(b.a)}</small></div>`).join('')}</div><div class="small faint" style="margin-top:8px">เช้า 05–11 น. · บ่าย 12–16 น. · เย็น 17–20 น. · กลางคืน 21–04 น. · ไม่รวมรายจ่ายประจำ</div>` : '<div class="empty-note">ยังไม่มีรายการในเดือนนี้</div>'}</div>`;
}
function setupCard() {
  return `<div class="card"><h2>👋 เริ่มต้นใช้งาน</h2><div class="muted small" style="margin-bottom:10px">ใส่งบที่ตั้งใจใช้ต่อเดือน (ไม่รวมค่าบ้าน ค่าไฟ และบิลประจำ) แอพจะคำนวณงบรายวันและระบายสีปฏิทินให้</div>
  <label class="fld"><span>งบใช้จ่ายต่อเดือน (บาท)</span><input id="setupAmt" inputmode="decimal" placeholder="เช่น 20000"></label>
  <div class="btnrow"><button class="btn primary" data-act="setupSave">ตั้งงบ</button><button class="btn soft" data-act="demo">ลองดูข้อมูลตัวอย่าง</button></div></div>`;
}

/* ---------- views ---------- */
function vToday() {
  const T = todayStr(), d = new Date(), y = d.getFullYear(), m = d.getMonth();
  const L = dayList(T), sp = daySpent(T), bud = dayBudget(T), lv = level(sp, bud);
  let h = '';
  if (!hasBudget()) h += setupCard();
  const real = S.ex.filter(e => !e.demo);
  const lb = S.settings.lastBackup;
  if (real.length >= 30 && (!lb || Date.now() - lb > 14 * 864e5)) h += `<div class="banner">💾<div class="grow">${lb ? 'ไม่ได้สำรองข้อมูลมา ' + Math.floor((Date.now() - lb) / 864e5) + ' วันแล้ว' : 'ยังไม่เคยสำรองข้อมูล'} — ถ้าล้างประวัติ Safari ข้อมูลอาจหายได้</div><button class="btn sm soft" data-act="backup">สำรอง</button></div>`;
  if (S.ex.some(e => e.demo)) h += `<div class="banner info">🧪<div class="grow">ตอนนี้มีข้อมูลตัวอย่างอยู่ ลบออกได้ก่อนเริ่มใช้จริง</div><button class="btn sm soft" data-act="clearDemo">ลบตัวอย่าง</button></div>`;
  h += importCard();
  const p = bud > 0 ? Math.min(1, sp / bud) : 0, C = 2 * Math.PI * 44;
  const col = lv === 'over' ? 'var(--bad)' : lv === 'high' ? 'var(--lux)' : 'var(--good)';
  const left = bud - sp;
  const mb = monthBudget(y, m), before = sum(counted(monthList(y, m).filter(e => e.date < T))), daysLeft = dim(y, m) - d.getDate() + 1, perDay = (mb - before) / daysLeft;
  h += `<div class="card"><div class="muted small">${longDate(T)}</div>
  <div class="hero" style="margin-top:8px"><div class="ring"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="44" fill="none" stroke="var(--soft)" stroke-width="10"/><circle cx="50" cy="50" r="44" fill="none" stroke="${col}" stroke-width="10" stroke-linecap="round" stroke-dasharray="${(C * p).toFixed(1)} ${C.toFixed(1)}"/></svg><div class="c"><div>${bud > 0 ? Math.round(sp / bud * 100) + '%' : '–'}<small>ของงบวันนี้</small></div></div></div>
  <div class="grow"><div class="small muted">ใช้ไปแล้ววันนี้</div><div class="big ${lv === 'none' ? '' : lv}">฿${fmt(sp)}</div><div class="small muted">งบวันนี้ ฿${fmt0(bud)}</div>
  <div style="margin-top:6px">${bud > 0 ? (left >= 0 ? `<span class="pill low">เหลือ ฿${fmt0(left)}</span>` : `<span class="pill over">⚠ เกินงบ ฿${fmt0(-left)}</span>`) : ''}</div></div></div>
  ${hasBudget() ? `<div class="tip">${perDay >= 0 ? `ถ้าจะจบเดือนนี้ในงบ ใช้ได้อีก <b>วันละ ฿${fmt0(perDay)}</b> (เหลือ ${daysLeft} วัน รวมวันนี้)` : `งบเดือนนี้ใช้เกินไปแล้ว <b style="color:var(--bad)">฿${fmt0(-(mb - before))}</b> ลองคุมรายจ่ายช่วงที่เหลือนะคะ`}</div>` : ''}</div>`;
  const qc = topCats();
  h += `<div class="card"><h2>จดเร็ว <small>— แตะหมวดแล้วใส่จำนวนเงิน</small></h2><div class="qgrid">${qc.map(c => `<button data-act="add" data-cat="${c.id}"><span>${c.icon}</span><em>${esc(c.name)}</em></button>`).join('')}</div>`;
  const fq = frequent();
  if (fq.length) h += `<div class="small muted" style="margin:14px 0 8px">ใช้บ่อย — แตะเพื่อกรอกให้อัตโนมัติ</div><div class="chips">${fq.map((f, i) => `<button class="chip" data-act="quick" data-i="${i}">${catOf(f.cat).icon} ${esc(f.note)} <b>${fmt(f.amt)}</b></button>`).join('')}</div>`;

/* ---------- files ---------- */
async function saveFile(name, text, type) {
  const blob = new Blob([text], { type });
  try {
    const f = new File([blob], name, { type });
    if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent) && navigator.canShare && navigator.canShare({ files: [f] })) { await navigator.share({ files: [f], title: name }); return true; }
  } catch (e) { if (e && e.name === 'AbortError') return false; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.append(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
  return true;
}
async function backup() {
  const data = JSON.stringify({ app: 'jodjai', v: 1, exported: new Date().toISOString(), settings: { ...S.settings }, cats: S.cats, ex: S.ex, rec: S.rec, rules: S.rules });
  const ok = await saveFile(`จดจ่าย_สำรอง_${todayStr()}.json`, data, 'application/json');
  if (ok) { S.settings.lastBackup = Date.now(); save(); toast('สำรองข้อมูลแล้ว'); if (U.tab === 'today') render(); }
}
async function exportCsv() {
  const q = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
  const L = S.ex.slice().sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time));
  const lines = ['วันที่,เวลา,หมวด,รายการ,จำนวนเงิน,ของเพื่อสุขภาพ,ของฟุ่มเฟือย,ไม่นับงบรายวัน'];
  for (const e of L) lines.push([e.date, e.time, q(catOf(e.cat).name), q(e.note), e.amt, e.tags && e.tags.h ? 1 : 0, e.tags && e.tags.l ? 1 : 0, e.fixed ? 1 : 0].join(','));
  await saveFile(`จดจ่าย_รายการ_${todayStr()}.csv`, '﻿' + lines.join('\r\n'), 'text/csv');
}
function importData(text) {
  let o;
  try { o = JSON.parse(text); } catch (e) { toast('ไฟล์ไม่ถูกต้อง'); return; }
  if (!o || !Array.isArray(o.ex)) { toast('ไม่ใช่ไฟล์สำรองของจดจ่าย'); return; }
  const valid = o.ex.filter(e => e && e.id && /^\d{4}-\d{2}-\d{2}$/.test(e.date) && +e.amt > 0);
  if (!S.ex.length && !S.rec.length) {
    S.settings = { ...S.settings, ...(o.settings || {}) };
    if (Array.isArray(o.cats) && o.cats.length) S.cats = o.cats;
    S.ex = valid; S.rec = Array.isArray(o.rec) ? o.rec : [];
    S.rules = o.rules && typeof o.rules === 'object' ? o.rules : {};
  } else {
    if (o.rules && typeof o.rules === 'object') for (const k in o.rules) if (!S.rules[k]) S.rules[k] = o.rules[k];
    const ids = new Set(S.ex.map(e => e.id)), rids = new Set(S.rec.map(r => r.id)), cids = new Set(S.cats.map(c => c.id));
    for (const c of (o.cats || [])) if (!cids.has(c.id)) S.cats.push(c);
    for (const e of valid) if (!ids.has(e.id)) S.ex.push(e);
    for (const r of (o.rec || [])) if (!rids.has(r.id)) S.rec.push(r);
  }
  if (!S.cats.some(c => c.id === 'other')) S.cats.push({ ...DEF_CATS[DEF_CATS.length - 1] });
  save(); closeSheet(); render(); toast(`กู้คืนแล้ว ${valid.length} รายการ`);
}

/* ---------- demo data ---------- */
function makeDemo() {
  let seed = 20261119;
  const rnd = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  const ri = (a, b) => Math.round(a + rnd() * (b - a));
  const pick = a => a[Math.floor(rnd() * a.length)];
  const items = [
    ['food', 'ข้าวมันไก่', 45, 60, 6], ['food', 'ก๋วยเตี๋ยว', 50, 70, 5], ['food', 'ข้าวกะเพราไข่ดาว', 50, 70, 5], ['food', 'ส้มตำ ไก่ย่าง', 120, 220, 2], ['food', 'ชาบู', 380, 650, 1],
    ['drink', 'กาแฟ', 45, 85, 6], ['drink', 'ชานมไข่มุก', 45, 75, 3], ['drink', 'ขนม 7-11', 25, 80, 3],
    ['travel', 'Grab', 90, 220, 2], ['travel', 'BTS', 30, 60, 3], ['fuel', 'เติมน้ำมัน', 600, 1200, 0.4],
    ['shop', 'เสื้อผ้า', 290, 990, 0.4, 'l'], ['home', 'ของใช้ในบ้าน', 80, 320, 1], ['health', 'วิตามิน', 250, 650, 0.3, 'h'], ['food', 'ผลไม้', 40, 90, 1.5, 'h'], ['fun', 'ดูหนัง', 220, 380, 0.4, 'l']
  ];
  const W = items.reduce((t, i) => t + i[4], 0);
  const pickItem = () => { let r = rnd() * W; for (const i of items) { r -= i[4]; if (r <= 0) return i; } return items[0]; };
  const hours = [7, 8, 8, 9, 10, 11, 12, 12, 13, 14, 15, 16, 17, 18, 18, 19, 19, 20, 21, 22];
  const T = todayStr(), t = parseYmd(T), start = new Date(t.getFullYear(), t.getMonth() - 1, 1), ex = [];
  for (let d = new Date(start); ymd(d) <= T; d.setDate(d.getDate() + 1)) {
    const ds = ymd(d), k = ri(2, 5);
    for (let j = 0; j < k; j++) {
      const it = pickItem(), h = pick(hours);
      if (ds === T && h > new Date().getHours()) continue;
      ex.push({ id: uid() + j, date: ds, time: `${pad(h)}:${pad(ri(0, 59))}`, amt: ri(it[2], it[3]), cat: it[0], note: it[1], tags: { h: it[5] === 'h', l: it[5] === 'l' }, fixed: false, demo: true });

    } else { amt = vals[0]; dir = /รับ|ฝาก|deposit|เข้า/i.test(joined) ? 'in' : 'out'; }
    if (bal != null) prev = bal;
    const desc = text.slice().sort((a, b) => b.s.length - a.s.length)[0];
    const kind = text.filter(t => t !== desc).map(t => t.s).join(' · ');
    out.push({ p: r.p, y: r.y, date, time: tm ? tm.s : '', amt, bal, dir, desc: desc ? desc.s : '', kind });

}

      S.cats = S.cats.filter(c => c.id !== id); save(); $('#catman').innerHTML = catManHtml(); render(); toast('ลบหมวดแล้ว ย้ายรายการไป "อื่น ๆ"'); break;
    }
    case 'pay': { const r = S.rec.find(x => x.id === b.dataset.r); if (!r) return; const key = b.dataset.ym, T = todayStr(), [yy, mm] = key.split('-').map(Number); const ds = T.startsWith(key) ? T : (key < T.slice(0, 7) ? `${key}-${pad(dueDay(r, yy, mm - 1))}` : T); openAdd({ amt: r.amt, cat: r.cat, note: r.name, fixed: !r.count, rid: r.id, rm: key, date: ds }); break; }
    case 'recNew': openRec(); break;
    case 'recEdit': openRec(b.dataset.r); break;
    case 'rcat': RF.cat = b.dataset.cat; SH.sh.querySelectorAll('[data-act=rcat]').forEach(x => x.classList.toggle('on', x === b)); break;
    case 'rtog': { const k = b.dataset.k; RF[k] = k === 'active' ? RF.active === false : !RF[k]; b.classList.toggle('on'); break; }
    case 'rsave': saveRec(); break;
    case 'rdel':
      if (!b.dataset.armed) { b.dataset.armed = '1'; b.textContent = 'แตะอีกครั้งเพื่อยืนยัน (รายการที่จ่ายไปแล้วยังอยู่)'; return; }
      S.rec = S.rec.filter(r => r.id !== RF.id); save(); closeSheet(); render(); toast('ลบรายการประจำแล้ว'); break;
  }
});
document.addEventListener('input', ev => {
  const t = ev.target;
  if (t.id === 'q') { U.q = t.value; $('#loglist').innerHTML = logList(); }
  else if (t.id === 'sBud') { const v = parseAmt(t.value); const k = S.settings.mode === 'daily' ? 'daily' : 'monthly'; S.settings[k] = v > 0 ? v : 0; save(); updPerDay(); render(); }
});
document.addEventListener('change', ev => {
  const t = ev.target;
  if (t.id === 'qcat') { U.qcat = t.value; $('#loglist').innerHTML = logList(); }
  else if (t.id === 'sWarn') { S.settings.warn = +t.value; save(); render(); }
  else if (t.id === 'sPay') { S.settings.payday = +t.value; save(); render(); }
  else if (t.id === 'slipFile') { const fs = [...(t.files || [])]; t.value = ''; if (fs.length) importSlips(fs); }
  else if (t.id === 'pdfFile') { const fs = [...(t.files || [])]; t.value = ''; if (fs.length) importPdfs(fs); }
  else if (t.id === 'sMyName') { S.settings.myName = t.value.trim(); save(); }
  else if (t.dataset && t.dataset.ir != null) { const r = IMP && IMP.rows[+t.dataset.ir]; if (!r) return; const f = t.dataset.f; if (f === 'on') r.on = t.checked; else if (f === 'cat') { r.cat = t.value; r.catTouched = true; if (r.skipWhy === 'unknown') r.skipWhy = null; r.on = true; } else if (f === 'fixed') r.fixed = t.checked; else if (f === 'amt') { const v = parseAmt(t.value); r.amt = v > 0 ? v : 0; } updImportTotal(); return; }
  else if (t.id === 'importFile') { const f = t.files && t.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => importData(r.result); r.readAsText(f); t.value = ''; }
});
document.addEventListener('keydown', ev => {
  if (ev.key === 'Escape') closeSheet();
  if (ev.key === 'Enter' && SH && (ev.target.id === 'fAmt' || ev.target.id === 'fNote')) { ev.preventDefault(); saveForm(); }
});
document.addEventListener('visibilitychange', () => { if (!document.hidden && !SH) { const n = new Date(); if (ymd(n) !== ymd(now0)) { now0.setTime(n.getTime()); } render(); } });

/* ---------- boot ---------- */
render();
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) { window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {})); }
</script>
